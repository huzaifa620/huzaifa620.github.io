name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every local link and asset resolves
        run: |
          python3 - <<'PY'
          import re, pathlib, sys
          root = pathlib.Path("site")
          missing = []
          for page in root.rglob("*.html"):
              for ref in re.findall(r'(?:href|src)="(/[^"#?]*)"', page.read_text(encoding="utf-8")):
                  p = root / ref.lstrip("/")
                  if not (p.is_file() or (p / "index.html").is_file()):
                      missing.append(f"{page}: {ref}")
          for ref in re.findall(r'url\((/[^)]+)\)', (root / "assets/fonts/fonts.css").read_text()):
              if not (root / ref.lstrip("/")).is_file():
                  missing.append(f"fonts.css: {ref}")
          print("\n".join(missing) or "all local links resolve")
          sys.exit(1 if missing else 0)
          PY
      - name: Publish to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: site
          clean: true
